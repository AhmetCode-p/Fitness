<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrenman</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #eee;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  h1 {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #e8ff47;
    line-height: 1;
  }

  .subtitle {
    color: #555;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .day-card {
    background: #111;
    border: 1px solid #222;
    padding: 1.5rem;
  }

  .day-label {
    font-size: 1.8rem;
    font-weight: 900;
    color: #e8ff47;
    letter-spacing: 0.08em;
    margin-bottom: 0.2rem;
  }

  .day-tag {
    font-size: 0.62rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 1.2rem;
    border-left: 2px solid #e8ff47;
    padding-left: 0.5rem;
  }

  .ex-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.4rem;
    border-bottom: 1px solid #1a1a1a;
  }

  .ex-row:last-of-type { border-bottom: none; }

  .ex-check {
    appearance: none;
    -webkit-appearance: none;
    width: 17px;
    height: 17px;
    min-width: 17px;
    border: 1.5px solid #555;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    background: transparent;
  }

  .ex-check:checked {
    background: #e8ff47;
    border-color: #e8ff47;
  }

  .ex-check:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 1px;
    width: 5px; height: 9px;
    border: 2.5px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  .ex-info { flex: 1; }

  .ex-name {
    font-size: 0.82rem;
    font-weight: 700;
    color: #eee;
    line-height: 1.3;
    display: block;
  }

  .ex-name.done {
    text-decoration: line-through;
    opacity: 0.35;
  }

  .ex-detail {
    font-size: 0.63rem;
    color: #555;
    margin-top: 0.1rem;
    display: block;
  }

  .kg-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .kg-input {
    width: 46px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    color: #e8ff47;
    font-size: 0.72rem;
    font-weight: 700;
    font-family: inherit;
    text-align: center;
    padding: 5px 2px;
    -webkit-appearance: none;
    appearance: none;
  }

  .kg-input::placeholder { color: #333; }
  .kg-input:focus { outline: none; border-color: #e8ff47; }

  .kg-label {
    font-size: 0.52rem;
    color: #444;
    margin-top: 2px;
  }

  .reset-btn {
    display: block;
    margin: 3rem auto 0;
    background: transparent;
    border: 1px solid #222;
    color: #444;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.75rem 2rem;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>SPLIT</h1>
  <p class="subtitle">Haftalik Antrenman Programi</p>
</header>

<div class="days-grid" id="grid"></div>
<button class="reset-btn" onclick="resetAll()">Tumunu Sifirla</button>

<script>
const program = [
  { day: "PAZARTESI", tag: "Gogus - Omuz - Triceps", exercises: [
    ["Bench Press", "3 set | 6-10 tekrar | agirdan hafife"],
    ["Fly (Duz Bench)", "2 set | forma dikkat"],
    ["Vertical Chest Press", "2 set | 6-10 tekrar"],
    ["Lateral Raise", "3 set | 10-20 tekrar"],
    ["Skull Crusher", "2 set | 6-10 tekrar"],
    ["Rope Pushdown", "2 set | 6-10 tekrar"],
    ["Sinav", "2 set"]
  ]},
  { day: "SALI", tag: "Sirt - Biceps", exercises: [
    ["Lat (Bar)", "4 set"],
    ["Cable Row", "4 set"],
    ["Lat Pulldown V-Bar", "3 set"],
    ["Face Pull", "3 set | 15-20 tekrar | hafif agirlik"],
    ["Biceps Curl (Normal)", "2 set"],
    ["Hammer Curl", "2 set"]
  ]},
  { day: "PERSEMBE", tag: "Bacak", exercises: [
    ["Hack Squat", "4 set | 6-10 tekrar"],
    ["Romanian Deadlift", "3 set | 8-10 tekrar"],
    ["Leg Curl", "3 set | 10-12 tekrar"],
    ["Leg Extension", "3 set | 12-15 tekrar"],
    ["Calf Raise", "4 set | 15-20 tekrar"]
  ]},
  { day: "CUMARTESI", tag: "Ust Vucut", exercises: [
    ["Shoulder Press", "4 set | kilo dusurerek"],
    ["Lateral Raise", "2 set | yuksek tekrar"],
    ["T-Bar Row", "4 set"],
    ["Rear Delt Fly", "2 set"],
    ["Vertical Chest Press", "3 set | kilo dusurerek"],
    ["Triceps Cable Overhead", "3 set"],
    ["Biceps Cable Curl", "3 set"]
  ]}
];

const STORAGE_KEY = 'split_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}

function save(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) {}
}

function buildGrid() {
  const state = load();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  program.forEach((day, di) => {
    const card = document.createElement('div');
    card.className = 'day-card';

    let html = '<div class="day-label">' + day.day + '</div>';
    html += '<div class="day-tag">' + day.tag + '</div>';

    day.exercises.forEach((ex, ei) => {
      const id = di + '_' + ei;
      const checked = state['c_' + id] ? 'checked' : '';
      const kg = state['k_' + id] || '';
      const doneClass = state['c_' + id] ? ' done' : '';

      html += '<div class="ex-row">';
      html += '<input type="checkbox" class="ex-check" ' + checked + ' onchange="toggle(\'' + id + '\',this.checked)">';
      html += '<div class="ex-info">';
      html += '<span class="ex-name' + doneClass + '">' + ex[0] + '</span>';
      html += '<span class="ex-detail">' + ex[1] + '</span>';
      html += '</div>';
      html += '<div class="kg-wrap"><input class="kg-input" type="number" placeholder="--" value="' + kg + '" oninput="setKg(\'' + id + '\',this.value)"><span class="kg-label">kg</span></div>';
      html += '</div>';
    });

    card.innerHTML = html;
    grid.appendChild(card);
  });
}

function toggle(id, checked) {
  const state = load();
  state['c_' + id] = checked;
  save(state);
  buildGrid();
}

function setKg(id, val) {
  const state = load();
  state['k_' + id] = val;
  save(state);
}

function resetAll() {
  localStorage.removeItem(STORAGE_KEY);
  buildGrid();
}

buildGrid();
</script>
</body>
</html>
