<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antrenman</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #eee;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    padding: 2rem 1rem 4rem;
  }

  header { text-align: center; margin-bottom: 2.5rem; }

  h1 {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #e8ff47;
    line-height: 1;
  }

  .subtitle {
    color: #555;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .day-card {
    background: #111;
    border: 1px solid #222;
    padding: 1.5rem;
  }

  .day-label {
    font-size: 1.8rem;
    font-weight: 900;
    color: #e8ff47;
    letter-spacing: 0.08em;
    margin-bottom: 0.2rem;
  }

  .day-tag {
    font-size: 0.62rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 1.2rem;
    border-left: 2px solid #e8ff47;
    padding-left: 0.5rem;
  }

  .ex-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.4rem;
    border-bottom: 1px solid #1a1a1a;
  }

  .ex-row:last-of-type { border-bottom: none; }

  .ex-check {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    min-width: 16px;
    border: 1.5px solid #666;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
  }

  .ex-check:checked {
    background: #e8ff47;
    border-color: #e8ff47;
  }

  .ex-check:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 1px;
    width: 4px; height: 8px;
    border: 2px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  .ex-info { flex: 1; }

  .ex-name {
    font-size: 0.82rem;
    font-weight: 700;
    color: #eee;
    line-height: 1.3;
    display: block;
    transition: opacity 0.15s;
  }

  .ex-check:checked ~ .ex-info .ex-name {
    text-decoration: line-through;
    opacity: 0.35;
  }

  .ex-detail {
    font-size: 0.63rem;
    color: #666;
    margin-top: 0.1rem;
    display: block;
  }

  .kg-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .kg-input {
    width: 46px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 3px;
    color: #e8ff47;
    font-size: 0.72rem;
    font-weight: 700;
    text-align: center;
    padding: 4px 2px;
    -webkit-appearance: none;
    appearance: none;
  }

  .kg-input::placeholder { color: #3a3a3a; font-weight: 400; }
  .kg-input:focus { outline: none; border-color: #e8ff47; }

  .kg-label {
    font-size: 0.52rem;
    color: #444;
    margin-top: 2px;
  }

  .save-banner {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: #e8ff47;
    color: #000;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.6rem 1.5rem;
    border-radius: 2px;
    cursor: pointer;
    border: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 20px rgba(232,255,71,0.3);
  }
</style>
</head>
<body>

<header>
  <h1>SPLIT</h1>
  <p class="subtitle">Haftalik Antrenman Programi</p>
</header>

<div class="days-grid" id="grid"></div>

<button class="save-banner" onclick="saveState()">Kaydet</button>

<script>
const program = [
  { day: "PAZARTESI", tag: "Gogus - Omuz - Triceps", exercises: [
    "Bench Press|3 set | 6-10 tekrar | agirdan hafife",
    "Fly (Duz Bench)|2 set | forma dikkat",
    "Vertical Chest Press|2 set | 6-10 tekrar",
    "Lateral Raise|3 set | 10-20 tekrar",
    "Skull Crusher|2 set | 6-10 tekrar",
    "Rope Pushdown|2 set | 6-10 tekrar",
    "Sinav|2 set"
  ]},
  { day: "SALI", tag: "Sirt - Biceps", exercises: [
    "Lat (Bar)|4 set",
    "Cable Row|4 set",
    "Lat Pulldown V-Bar|3 set",
    "Face Pull|3 set | 15-20 tekrar | hafif agirlik",
    "Biceps Curl (Normal)|2 set",
    "Hammer Curl|2 set"
  ]},
  { day: "PERSEMBE", tag: "Bacak", exercises: [
    "Hack Squat|4 set | 6-10 tekrar",
    "Romanian Deadlift|3 set | 8-10 tekrar",
    "Leg Curl|3 set | 10-12 tekrar",
    "Leg Extension|3 set | 12-15 tekrar",
    "Calf Raise|4 set | 15-20 tekrar"
  ]},
  { day: "CUMARTESI", tag: "Ust Vucut", exercises: [
    "Shoulder Press|4 set | kilo dusurerek",
    "Lateral Raise|2 set | yuksek tekrar",
    "T-Bar Row|4 set",
    "Rear Delt Fly|2 set",
    "Vertical Chest Press|3 set | kilo dusurerek",
    "Triceps Cable Overhead|3 set",
    "Biceps Cable Curl|3 set"
  ]}
];

// Load state from URL hash
function loadState() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return { checks: {}, kgs: {} };
    return JSON.parse(decodeURIComponent(atob(hash)));
  } catch(e) {
    return { checks: {}, kgs: {} };
  }
}

function saveState() {
  const checks = {};
  const kgs = {};
  document.querySelectorAll('.ex-check').forEach(el => {
    if (el.checked) checks[el.dataset.id] = 1;
  });
  document.querySelectorAll('.kg-input').forEach(el => {
    if (el.value) kgs[el.dataset.id] = el.value;
  });
  const encoded = btoa(encodeURIComponent(JSON.stringify({ checks, kgs })));
  window.location.hash = encoded;

  // Flash feedback
  const btn = document.querySelector('.save-banner');
  btn.textContent = 'Kaydedildi!';
  setTimeout(() => btn.textContent = 'Kaydet', 1500);
}

function buildGrid() {
  const state = loadState();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  program.forEach((dayData, di) => {
    const card = document.createElement('div');
    card.className = 'day-card';

    let html = '<div class="day-label">' + dayData.day + '</div>';
    html += '<div class="day-tag">' + dayData.tag + '</div>';

    dayData.exercises.forEach((ex, ei) => {
      const parts = ex.split('|');
      const name = parts[0];
      const detail = parts[1] || '';
      const id = di + '-' + ei;
      const checked = state.checks[id] ? 'checked' : '';
      const kg = state.kgs[id] || '';

      html += '<div class="ex-row">';
      html += '<input type="checkbox" class="ex-check" data-id="' + id + '" ' + checked + '>';
      html += '<div class="ex-info"><span class="ex-name">' + name + '</span><span class="ex-detail">' + detail + '</span></div>';
      html += '<div class="kg-wrap"><input class="kg-input" type="number" placeholder="--" data-id="' + id + '" value="' + kg + '"><span class="kg-label">kg</span></div>';
      html += '</div>';
    });

    card.innerHTML = html;
    grid.appendChild(card);
  });
}

buildGrid();
</script>
</body>
</html>
